---
# TRAEFIK STACK - TRAEFIK & WHOAMI SERVICE
name: traefik-stack

networks:
  traefik-dev:

configs: {}

secrets: {}

# volumes:
#   traefik_data:
#     driver: local
#     driver_opts:
#       type: none
#       device: 
#       o: bind

services:
  # TRAEFIK - LOAD BALANCER / SSL / WEB SERVER
  traefik:
    container_name: traefik
    image: traefik:2.2
    restart: always
    # command:
    #   - "--providers.docker.swarmmode=true"
    #   - "--providers.docker.endpoint=unix:///var/run/docker.sock"
    #   - "--providers.docker.exposedbydefault=false"
    #   - "--entrypoints.web.address=:80"
    #   - "--entrypoints.websecure.address=:443"
    #   - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
    #   - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
    #   - "--certificatesresolvers.myresolver.acme.email=acme_email"
    #   - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    #   - "--log.level=DEBUG"
    #   - "--api.dashboard=true"
    networks:
      - traefik-dev
    ports:
          - target: 8181
        published: 8080
        protocol: tcp
        mode: host
          - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      # - target: 2222
      #   published: 2222
      #   protocol: tcp
      #   mode: host
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # - "/traefik/traefik.yaml:/traefik.yaml"
      # - "/traefik/basicAuth:/basicAuth"
      # - "/traefik/conf.d/:/conf.d/"
      # - "/traefik/acme.json:/acme.json"
      # ALT
      # - "traefik_data:/letsencrypt"
    deploy:
      placement:
        constraints:
          - node.role == manager
# 
  whoami:
    image: "containous/whoami:1.6.0"
    networks:
      - traefik-dev
    # deploy:
    #   labels:
    #     - "traefik.enable=true"
    #     - "traefik.http.routers.whoami.rule=Host(`whoami.dev.local`)"
    #     - "traefik.http.routers.whoami.entrypoints=websecure"
    #     - "traefik.http.routers.whoami.tls.certresolver=myresolver"
    #     - "traefik.http.services.whoami.loadbalancer.server.port=80"
