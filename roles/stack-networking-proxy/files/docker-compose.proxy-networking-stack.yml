---
# Proxy Networking Stack
# Networking proxy stack including Traefik load balancer and Whoami for testing.

networks:
  traefik-development:
    external: true

# configs: {}

secrets:
  cloudflare_api_token:
    external: true

volumes:
  traefik:
    driver: local

services:
  # TRAEFIK - LOAD BALANCER / SSL / WEB SERVER
  traefik:
    image: traefik:3.4

    networks:
    # Connect to the overlay network for inter-container communication across nodes
      - traefik-development

    ports:
    # Expose Traefik's entry points to the Swarm
      - target: 80    # Container port (Traefik web entrypoint)
        published: 80 # Host port exposed on the nodes
        protocol: tcp
        mode: host
        # 'host' mode binds directly to the node's IP where the task runs
        # 'ingress' based on your load balancing strategy. 'host' is ofter simpler if using an external loadbalancer
      - target: 443   # Container port (Traefik websecure entrypoint)
        published: 443
        protocol: tcp
        mode: host

    volumes:
    # Mount the Docker socket for the Swarm provider
    # This MUST be ran from a manager node to access the Swarm API via the socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik:/certs

    # Traefik Static configuration via command-line arguments
    command:
      # HTTP EntryPoint
      - "--entrypoints.web.address=:80"

      # Configure HTTP to HTTPS Redirection
      # - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      # - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # HTTPS EntryPoint
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certresolver=cloudflare"

      # ACME Configuration
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"

      - "--certificatesresolvers.cloudflare.acme.caserver=https://acme-v02.api.letsencrypt.org/directory" # production (default)
      # - "--certificatesresolvers.cloudflare.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory" # staging
      - "--certificatesresolvers.cloudflare.acme.email=ackoujens@gmail.com"
      - "--certificatesresolvers.cloudflare.acme.storage=/certs/acme.json"      

      # Attach dynamic TLS file
      # - "--providers.file.filename=/dynamic/tls.yaml"

      # Providers

      # Enable the Docker Swarm provider (instead of Docker provider)
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"

      # Watch for Swarm service changes (requires socket access)
      - "--providers.swarm.watch=true"

      # Recommended: Don't expose services by default; require explicit labels
      - "--providers.swarm.exposedbydefault=false"

      # Specify the default network for Traefik to connect to services
      - "--providers.swarm.network=traefik-development"

      # API & Dashboard
      - "--api.dashboard=true" # Enable the dashboard
      - "--api.insecure=true" # Explicitly disable insecure API mod

      # Observability
      - "--log.level=DEBUG" # Set the Log Level e.g INFO, DEBUG
      - "--accesslog=true" # Enable Access Logs
      # - "--metrics.prometheus=true"  # Enable Prometheus

    # environment:
      - CF_API_EMAIL=ackoujens@gmail.com
      - CF_DNS_API_TOKEN=/run/secrets/cloudflare_api_token
    
    secrets:
      - cloudflare_api_token

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        
        # Dashboard router
        - "traefik.http.routers.dashboard.rule=Host(`dev-traefik.shackofnoreturn.com`)"
        - "traefik.http.routers.dashboard.entrypoints=websecure"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.routers.dashboard.tls=true"

        # Basic‑auth middleware
        # - "traefik.http.middlewares.dashboard-auth.basicauth.users=<PASTE_HASH_HERE>"
        # - "traefik.http.routers.dashboard.middlewares=dashboard-auth@swarm"

        # Service hint
        - "traefik.http.services.traefik.loadbalancer.server.port=8080"


  whoami:
    image: "traefik/whoami:v1.11.0"
    networks:
      - traefik-development
    deploy:
      labels:
        # Enable Service discovery for Traefik
        - "traefik.enable=true"
        # Define the WHoami router rule
        - "traefik.http.routers.whoami.rule=Host(`dev-whoami.shackofnoreturn.com`)"
        # Expose Whoami on the HTTPS entrypoint
        - "traefik.http.routers.whoami.entrypoints=websecure"
        # Enable TLS
        - "traefik.http.routers.whoami.tls=true"
        # Expose the whoami port number to Traefik
        - "traefik.http.services.whoami.loadbalancer.server.port=80"
