---
# roles/portainer-push/tasks/main.yml

- name: Set git commit target path
  set_fact:
    git_commit_target_path: "roles/{{ target_stack }}"

- name: Ensure git repo exists
  stat:
    path: "{{ git_repo_path }}/.git"
  register: git_repo

- name: Fail if not a git repository
  fail:
    msg: "Directory {{ git_repo_path }} is not a git repository"
  when: not git_repo.stat.exists

- name: Ensure commit target is defined
  fail:
    msg: "git_commit_target_path must be set (e.g. roles/stack-network-proxy)"
  when: git_commit_target_path | length == 0

- name: Check git status for target path only
  command: git status --porcelain "{{ git_commit_target_path }}"
  args:
    chdir: "{{ git_repo_path }}"
  register: git_status
  changed_when: false

- name: Skip if no changes in target path
  debug:
    msg: "No changes detected in {{ git_commit_target_path }} — skipping commit"
  when: git_status.stdout == ""

- name: Stage ONLY target path
  command: git add "{{ git_commit_target_path }}"
  args:
    chdir: "{{ git_repo_path }}"
  when: git_status.stdout != ""

- name: Commit ONLY target path
  command: >
    git commit
    -m "{{ git_commit_message }}"
    --author="{{ git_author_name }} <{{ git_author_email }}>"
  args:
    chdir: "{{ git_repo_path }}"
  when: git_status.stdout != ""

- name: Push changes
  command: git push origin "{{ git_branch }}"
  args:
    chdir: "{{ git_repo_path }}"
  when: git_status.stdout != ""
