---
# Dashboard Utility Stack
# Networking proxy stack including Traefik load balancer and Whoami for testing.

networks:
  traefik-dev:


services:
  dashy:
    image: lissy93/dashy:latest
    restart: always
    networks:
      - traefik-dev
    ports:
      - target: 8080
        published: 8182
        protocol: tcp
        mode: host
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
