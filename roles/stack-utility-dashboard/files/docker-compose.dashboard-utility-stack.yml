---
# Dashboard Utility Stack
# Utility dashboards for users and productivity purposes.

networks:
  traefik-dev:

services:
  dashy:
    image: lissy93/dashy:latest
    networks:
      - traefik-dev
    ports:
      - target: 8080
        published: 8182
        protocol: tcp
        mode: host
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '1.00'
          memory: 2G

  heimdall:
    image: linuxserver/heimdall:latest
    networks:
      - traefik-dev
    deploy:
      placement:
        constraints:
          - node.role == manager

  homedash:
    image: linuxserver/homedish:latest
    networks:
      - traefik-dev
    deploy:
      placement:
        constraints:
          - node.role == manager

  homepage:
    image: b4bz/hompage:latest
    networks:
      - traefik-dev
    deploy:
      placement:
        constraints:
          - node.role == manager

  organizr:
    image: organizr/organizr:latest
    networks:
      - traefik-dev
    deploy:
      placement:
        constraints:
          - node.role == manager

  sui:
    image: ghcr.io/linuxserver/sui:latest
    networks:
      - traefik-dev
    deploy:
      placement:
        constraints:
          - node.role == manager
