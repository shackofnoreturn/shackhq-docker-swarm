---
# roles/stack-utility-dashboard/vars/main.yml

stack:
  name: dashboard-utility-stack
  full_name: "Dashboard Utility Stack"
  description: "Networking proxy stack including Traefik load balancer and Whoami for testing."
  # TODO: Move to global variables
  repo_url: "https://github.com/shackofnoreturn/shackhq-docker-swarm"
  # TODO: Change in global variables
  repo_branch: "refs/heads/dev"
  # TODO: Needs to be global
  repo_auth: false


traefik:
  version: "2.2"
  # TODO: Change "dev" with variable
  network: traefik-dev
  expose_internally: true
  expose_externally: false
  https_only: false
  # TODO: built from global domain var
  service_domain: dashy.dev.local
  auth: false
  dns_challenge_provider: false

dashy:
  version: "latest"

# TODO: Move to group_vars/all.yml
authelia:
  enable: false

tor:
  enable: false
  domain: ""

domain: dev.local
volumes_root: ""
