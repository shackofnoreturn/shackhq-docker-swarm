---
# /roles/portainer-start/tasks/main.yml

# PREPARE - Stack Data
- name: Load "{{ target_stack }}" vars
  include_vars:
    file: "{{ playbook_dir }}/../roles/{{ target_stack }}/vars/main.yml"
  tags: always

# ACCESS - Portainer API
- name: Get Portainer auth token
  ansible.builtin.uri:
    url: "{{ portainer.url }}/auth"
    method: POST
    body_format: json
    body:
      username: "{{ portainer.username }}"
      password: "{{ portainer.password }}"
    return_content: true
  register: portainer_auth
  no_log: true
  failed_when: portainer_auth.status != 200

- name: Handle Portainer auth response
  ansible.builtin.fail:
    msg: >-
      {% if portainer_auth.status == 400 %}
      ❌ Portainer API error: Invalid request (400). Check request body format.
      {% elif portainer_auth.status == 422 %}
      ❌ Portainer authentication failed (422). Invalid username or password.
      {% elif portainer_auth.status == 500 %}
      ❌ Portainer server error (500). Portainer service may be down.
      {% else %}
      ❌ Unexpected Portainer auth error ({{ portainer_auth.status }}).
      {% endif %}
  when: portainer_auth.status != 200

- name: Get JWT token from response
  set_fact:
    portainer_jwt: "{{ portainer_auth.json.jwt }}"
  when: portainer_auth.status == 200
  no_log: true


# CHECK - Swarm Info
- name: Get list of Portainer environments
  ansible.builtin.uri:
    url: "{{ portainer.url }}/endpoints"
    method: GET
    headers:
      Authorization: "Bearer {{ portainer_jwt }}"
    return_content: true
  register: portainer_envs

- name: Show list of Portainer environments
  debug:
    msg: >-
      {{ portainer_envs.json
         | map(attribute='Name')
         | zip(portainer_envs.json | map(attribute='Id'))
         | map('join', ' (ID: ')
         | map('regex_replace', '$', ')')
         | list }}

- name: Get Swarm Info
  ansible.builtin.uri:
    url: "{{ portainer.url }}/endpoints/{{ portainer.endpoint }}/docker/swarm"
    headers:
      Authorization: "Bearer {{ portainer_jwt }}"
    method: GET
    return_content: true
  register: swarm_info

- name: Get all existing stacks
  uri:
    url: "{{ portainer.url }}/stacks"
    method: GET
    headers:
      Authorization: "Bearer {{ portainer_jwt }}"
    return_content: true
  register: stack_list

- name: Find existing stack ID (if any)
  ansible.builtin.set_fact:
    existing_stack: "{{ stack_list.json | selectattr('Name', 'equalto', stack.name) | list | first | default(None) }}"

- name: Extract existing stack ID
  ansible.builtin.set_fact:
    existing_stack_id: "{{ existing_stack.Id | default(None) }}"


# START - Portainer stack
- name: Starting stack {{ stack.name }}
  when: existing_stack is not none
  ansible.builtin.uri:
    url: "{{ portainer.url }}/stacks/{{ existing_stack_id }}/start?endpointId={{ portainer.endpoint }}"
    method: POST
    headers:
      Authorization: "Bearer {{ portainer_jwt }}"
      Content-Type: "application/json"
    return_content: true
    status_code: [200, 201]
  register: portainer_stack_start


# CHECK - Final result
- name: Display final result
  ansible.builtin.debug:
    msg: >-
      {% if existing_stack is not none %}
      ✅ Started '{{ stack.name }}' (ID {{ existing_stack_id }}).
      {% else %}
      ✅ Stack '{{ stack.name }}' was not found.
      {% endif %}
