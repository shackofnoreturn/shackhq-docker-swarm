# Stacks configuration file for ansible generator
stacks:
  traefik-stack:
    name:           "traefik-stack"
    title:          "Traefik Stack"
    description:    "Traefik reverse proxy with WhoIs service for testing."
    categories:     ["web", "backend"]
    logo:           "https://traefik.io/img/logo/traefik-logo.svg"
    repository:
      url:          "https://github.com/shackofnoreturn/shackhq-docker-swarm.git"
      reference:    "refs/heads/dev"
      stackfile:    "stacks/traefik/docker-compose.yml"

    services:
      traefik:
        title:      "Traefik Reverse Proxy"
        image:      "traefik"
        version:    "v3.5.3"
        ports:
        # TODO Remove port 80 in production
          - target: "80"
            published: "80"
            protocol: tcp
            mode: host
          - target: "443"
            published: "443"
            protocol: tcp
            mode: host
          - target: "8080"
            published: "8080"
            protocol: tcp
            mode: host
        configs:

      whoami:
        title:      "Whoami Test Service"
        image:      "traefik/whoami"
        version:    "v1.11.0"
        ports:
          - target: "80"
            published: "8081"
            protocol: tcp
            mode: host
