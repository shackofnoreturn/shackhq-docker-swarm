name: traefik
services:
  traefik:
    command:
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.myresolver.acme.tlschallenge=true
      - --certificatesresolvers.myresolver.acme.email=shackofnoreturn@gmail.com
      - --certificatesresolvers.myresolver.acme.storage=/data/acme.json
      - --log.level=INFO
      - --accesslog=true
    container_name: traefik
    deploy:
      mode: replicated
      replicas: 1
      labels:
        traefik.enable: "true"
        traefik.http.routers.dashboard.entrypoints: websecure
        traefik.http.routers.dashboard.rule: Host(`traefik.shackofnoreturn.com`)
        traefik.http.routers.dashboard.tls: "true"
        traefik.http.routers.dashboard.tls.certresolver: myresolver
        traefik.http.services.dashboard.loadbalancer.server.port: "8080"
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      resources:
        limits:
          cpus: 0.5
          memory: "536870912"
        reservations:
          cpus: 0.25
          memory: "268435456"
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 2m0s
      placement:
        constraints:
          - node.role == manager
      endpoint_mode: vip
    environment:
      ACME_EMAIL: shackofnoreturn@gmail.com
      COMMAND: ""
      CONTAINER_NAME: traefik
      DOMAIN: shackofnoreturn.com
      ENTRYPOINT: ""
      EXTRA_ENV_VAR: ""
      HEALTHCHECK_INTERVAL: 30s
      HEALTHCHECK_RETRIES: "5"
      HEALTHCHECK_START_PERIOD: 20s
      HEALTHCHECK_TIMEOUT: 10s
      HOSTNAME: traefik
      IMAGE: traefik
      IMAGE_TAG: v3.1
      LIMIT_CPUS: "0.5"
      LIMIT_MEMORY: 512M
      PGID: "1000"
      PUID: "1000"
      REPLICAS: "1"
      RESERVE_CPUS: "0.25"
      RESERVE_MEMORY: 256M
      SERVICE_NAME: traefik
      TZ: Europe/Brussels
      UMASK: "002"
    hostname: traefik
    image: traefik:v3.1
    networks:
      traefik-development: null
    ports:
      - mode: ingress
        target: 80
        published: "80"
        protocol: tcp
      - mode: ingress
        target: 443
        published: "443"
        protocol: tcp
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /home/shackadmin/Github/shackhq-docker-swarm/stacks/traefik/data
        target: /data
        bind:
          create_host_path: true
networks:
  traefik-development:
    name: traefik-development
    external: true
x-common-deploy:
  endpoint_mode: vip
  labels:
    - traefik.enable=true
    - traefik.http.routers.dashboard.rule=Host(`traefik.shackofnoreturn.com`)
    - traefik.http.routers.dashboard.entrypoints=websecure
    - traefik.http.routers.dashboard.tls=true
    - traefik.http.routers.dashboard.tls.certresolver=myresolver
    - traefik.http.services.dashboard.loadbalancer.server.port=8080
  mode: replicated
  placement:
    constraints:
      - node.role == manager
  replicas: "1"
  resources:
    limits:
      cpus: "0.50"
      memory: 512M
    reservations:
      cpus: "0.25"
      memory: 256M
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 5
    window: 120s
  rollback_config:
    delay: 10s
    order: stop-first
    parallelism: 1
  update_config:
    delay: 10s
    order: start-first
    parallelism: 1
x-common-logging:
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m
