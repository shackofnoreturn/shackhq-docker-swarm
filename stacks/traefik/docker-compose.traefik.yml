services:
  traefik:
    image: ${TRAEFIK_IMAGE}

    command:
      # ── Core ─────────────────────────────
      - "--log.level=${TRAEFIK_LOG_LEVEL}"
      - "--accesslog=${TRAEFIK_ACCESSLOG}"

      # ── API & Dashboard ──────────────────
      - "--api.dashboard=true"
      - "--api.insecure=false"

      # ── Entrypoints ──────────────────────
      - "--entrypoints.web.address=:${HTTP_PORT}"
      - "--entrypoints.websecure.address=:${HTTPS_PORT}"

      # ── Certificates ─────────────────────
      - "--certificatesresolvers.${TRAEFIK_CERT_RESOLVER}.acme.tlschallenge=true"
      - "--certificatesresolvers.${TRAEFIK_CERT_RESOLVER}.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.${TRAEFIK_CERT_RESOLVER}.acme.storage=${ACME_STORAGE}"

      # ── Providers ────────────────────────
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.exposedByDefault=false"

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt/acme.json

    networks:
      - ${TRAEFIK_NETWORK}

    deploy:
      replicas: ${TRAEFIK_REPLICAS:-1}
      placement:
        constraints:
          - node.role == ${CONSTRAINT_NODE_ROLE}
          - node.labels.node_id == ${CONSTRAINT_NODE_ID}
      restart_policy:
        condition: on-failure

networks:
  ${TRAEFIK_NETWORK}:
    driver: overlay

volumes:
  traefik-letsencrypt:
