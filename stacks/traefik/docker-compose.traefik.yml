services:
  traefik:
    image: traefik:v3.5.1

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt/acme.json

    networks:
      - traefik-dev

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.node_id == 4
      restart_policy:
        condition: on-failure

networks:
  traefik-dev:
    driver: overlay

volumes:
  traefik-letsencrypt:
